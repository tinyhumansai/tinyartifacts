[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor", "worktrees"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tiny-artifacts"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
# Capability-based filesystem operations keep `FsFileStore` keys under its root.
cap-std = "4"
# Open every source path component without following symlinks before host authorization.
cap-fs-ext = "4"
tokio = { version = "1", features = ["fs", "rt"] }
tracing = "0.1"
tinytools = { git = "https://github.com/tinyhumansai/tinytools.git", rev = "41cc80ac9acf37a14f20be94f60ee552749f1540", version = "0.6" }
# Artifact records and file bytes use the host-bound stable storage ports.
tinystoragedrivers-types = { version = "2.1.3", git = "https://github.com/tinyhumansai/tinystoragedrivers.git", rev = "f5a33025b9feaa36fea522cce764fe8c796e5139" }
tinystoragedrivers-api = { version = "2.1.3", git = "https://github.com/tinyhumansai/tinystoragedrivers.git", rev = "f5a33025b9feaa36fea522cce764fe8c796e5139" }
tinystoragedrivers-testkit = { version = "2.1.3", git = "https://github.com/tinyhumansai/tinystoragedrivers.git", rev = "f5a33025b9feaa36fea522cce764fe8c796e5139" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
